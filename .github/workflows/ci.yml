name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: espforge/package-lock.json
      - run: npm ci
        working-directory: espforge
      - run: npm run build
        working-directory: espforge
      - run: npm test
        working-directory: espforge
